# SPDX-License-Identifier: AGPL-3.0-only
[workspace]
# A virtual workspace does not take its resolver from the edition, so name the
# edition-2021 resolver explicitly.
resolver = "2"
members = ["crates/ox-core", "crates/ox-app"]

[workspace.package]
version = "2.0.1"
edition = "2021"
license = "AGPL-3.0-only"
# The oldest Rust the locked GTK and GIO crates build with. CI checks with
# exactly this version.
rust-version = "1.92"
publish = false

[workspace.dependencies]
# GTK 4.14 is the version in Zorin OS 18 (Ubuntu 24.04), so newer GTK APIs stay
# unavailable.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gio = "0.22"
# GTK 4.14 needs GLib 2.76, so its APIs (GBookmarkFile among them) are safe.
glib = { version = "0.22", features = ["v2_76"] }
# Compiles the GResource bundles in build scripts; its version follows glib.
glib-build-tools = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
thiserror = "2"
# Carries answers and progress from dialogs and GIO worker threads to the
# GTK main loop, as the gtk-rs book does.
async-channel = "2"
rustix = { version = "1", features = ["fs"] }
# The search cache is the SQLite database the Python app shares. It links the
# system SQLite, as Python's sqlite3 module does, so building needs its
# development files (libsqlite3-dev on Ubuntu). "hooks" provides the progress
# handler that cancels a running search.
rusqlite = { version = "0.38", default-features = false, features = ["functions", "hooks"] }
# The Secret Service client for SMB credentials (session_credentials.py used
# libsecret). Pure Rust with an encrypted session, so no C library or -dev
# package is needed; async-io keeps it independent of Tokio.
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
# ZIP member decompression for ox-core's `archive`: raw deflate, bzip2 and LZMA
# are the methods besides "stored" that v2.0.0:desktop/zip_extraction.py accepts; the
# same gzip, bzip2 and XZ decoders read .tar.gz, .tar.bz2 and .tar.xz
# archives, and XZ writes .tar.xz (ARC-023, ARC-024). All are pure Rust, so no
# C library is linked.
flate2 = "1.1"
bzip2 = "0.6"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "optimization", "xz", "encoder"] }
# Zstandard decompression for .tar.zst archives (ARC-024), pure Rust like the
# decoders above.
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
# The CRC-32 every extracted or previewed ZIP member is checked against.
crc32fast = "1.5"
tempfile = "3"
ox-core = { path = "crates/ox-core" }

# Every crate inherits these lints with `[lints] workspace = true`, so editors,
# `cargo clippy` and native/tools/check.py report the same findings. The check
# driver turns every warning into a failure.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The pedantic lints below are allowed because they flag deliberate choices,
# so their warnings would be noise rather than findings.
#
# Items are named for what they are, even when that repeats their module, as in
# `entry::EntryKind` or `clipboard::ClipboardMode`. Clippy 1.84 moved this lint
# from pedantic to restriction; the entry records the decision for anyone who
# enables it by name.
module_name_repetitions = "allow"
# `#[must_use]` is written where ignoring a result is a real mistake. Adding it
# to every pure function would hide those few among hundreds.
must_use_candidate = "allow"
# Related names such as `row` and `rows` are clearer than invented synonyms.
similar_names = "allow"

[profile.release]
# Thin LTO optimises across crates without the long link times of full LTO.
lto = "thin"
